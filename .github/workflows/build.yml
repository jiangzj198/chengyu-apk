name: 打包成语填空APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 预配置打包环境+编译APK
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir: .
          buildozer_command: buildozer android debug
        env:
          ANDROID_MIRROR: https://mirrors.cloud.tencent.com/AndroidSDK/
          P4A_ANDROID_MIRROR: https://mirrors.cloud.tencent.com/AndroidSDK/
      - name: 上传成品安装包
        uses: actions/upload-artifact@v4
        with:
          name: 成语填空安装包
          path: bin/*.apk
